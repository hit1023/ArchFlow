<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCHPULSE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1220'/%3E%3Cpath d='M3 17h6l3-9 5 17 3-8h9' fill='none' stroke='%2322d3ee' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* ARCHPULSE: dark-first の「コントロールルーム」。グリッド背景+ガラス調パネル+シアン→バイオレットの発光アクセント */
:root{
  --bg:#eef2f9; --bg2:#e3e9f4; --panel:#ffffff; --fg:#0f1b2d; --muted:#5a6b85; --line:#cdd6e5;
  --k8s:#2f6bff; --info:#0fa58a; --loki:#d98200; --warn:#c98f00; --err:#e03a5a; --purple:#7a4bf0;
  --a1:#0aa5c2; --a2:#7a4bf0; --glass:rgba(255,255,255,.72); --glow:rgba(47,107,255,.18);
  --font-ui:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --font-disp:"Space Grotesk","Noto Sans JP",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root{color-scheme:dark;
  --bg:#060a14; --bg2:#0a1120; --panel:rgba(16,25,44,.78); --fg:#e9f1ff; --muted:#8497b8; --line:#1f2e4a;
  --k8s:#5b8cff; --info:#2de2c0; --loki:#ffb347; --warn:#ffd166; --err:#ff5c7a; --purple:#a78bfa;
  --a1:#22d3ee; --a2:#8b5cf6; --glass:rgba(14,22,40,.66); --glow:rgba(34,211,238,.22);}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;
  --bg:#eef2f9; --bg2:#e3e9f4; --panel:#ffffff; --fg:#0f1b2d; --muted:#5a6b85; --line:#cdd6e5;
  --k8s:#2f6bff; --info:#0fa58a; --loki:#d98200; --warn:#c98f00; --err:#e03a5a; --purple:#7a4bf0;
  --a1:#0aa5c2; --a2:#7a4bf0; --glass:rgba(255,255,255,.72); --glow:rgba(47,107,255,.16)}}
:root[data-theme="light"]{color-scheme:light;
  --bg:#eef2f9; --bg2:#e3e9f4; --panel:#ffffff; --fg:#0f1b2d; --muted:#5a6b85; --line:#cdd6e5;
  --k8s:#2f6bff; --info:#0fa58a; --loki:#d98200; --warn:#c98f00; --err:#e03a5a; --purple:#7a4bf0;
  --a1:#0aa5c2; --a2:#7a4bf0; --glass:rgba(255,255,255,.72); --glow:rgba(47,107,255,.16)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--fg);font-family:var(--font-ui);font-size:14px;
  background:
    radial-gradient(900px 500px at 8% -10%,color-mix(in srgb,var(--a1) 16%,transparent),transparent 70%),
    radial-gradient(800px 500px at 100% 0%,color-mix(in srgb,var(--a2) 16%,transparent),transparent 70%),
    linear-gradient(var(--bg),var(--bg2));
  background-color:var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 75%)}
.shell{position:relative;display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{filter:drop-shadow(0 0 8px var(--glow))}
.brand b{font-family:var(--font-disp);font-weight:700;letter-spacing:.22em;font-size:1.05rem;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);font-size:.78rem;letter-spacing:.04em}
.chip{margin-left:auto;font-family:var(--font-mono);font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;display:flex;align-items:center;gap:7px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--info);box-shadow:0 0 10px var(--info);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.app{flex:1;min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr)}
aside{display:flex;flex-direction:column;gap:10px;padding:16px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-height:0}
.hint{color:var(--muted);font-size:.8rem;line-height:1.65;margin:0}
.label{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.msg{padding:9px 12px;border-radius:10px;font-size:.84rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{background:color-mix(in srgb,var(--a2) 14%,transparent);border:1px solid color-mix(in srgb,var(--a2) 35%,var(--line))}
.msg.a{background:color-mix(in srgb,var(--a1) 9%,transparent);border:1px solid color-mix(in srgb,var(--a1) 28%,var(--line))}
.msg.s{color:var(--muted);font-size:.76rem;padding:2px 4px}
.msg.e{color:var(--err);border:1px solid color-mix(in srgb,var(--err) 40%,var(--line));background:color-mix(in srgb,var(--err) 8%,transparent)}
textarea{width:100%;resize:vertical;min-height:82px;max-height:240px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--fg);font:inherit;line-height:1.6}
textarea:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 3px var(--glow)}
button{font:inherit;font-size:.82rem;color:var(--fg);background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .1s}
button:hover:not(:disabled){border-color:var(--a1);box-shadow:0 0 0 3px var(--glow)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.primary{border:0;color:#04101c;font-weight:700;background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 4px 22px var(--glow)}
button.primary:hover:not(:disabled){box-shadow:0 4px 30px var(--glow),0 0 0 3px var(--glow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:.74rem;padding:4px 11px;color:var(--muted)}
.composer{margin-top:14px;display:flex;flex-direction:column;gap:9px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.composer textarea{min-height:64px}
.composer .label{color:var(--fg);font-size:.78rem}
.mode{font-family:var(--font-mono);font-size:.7rem;color:var(--muted)}
main{display:flex;flex-direction:column;gap:12px;padding:18px 22px;min-width:0;min-height:0;overflow:auto}
.titlebar h2{margin:0;font-family:var(--font-disp);font-size:1.5rem;letter-spacing:.01em;text-wrap:balance}
.titlebar p{margin:3px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.tabs{display:inline-flex;align-self:flex-start;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--glass)}
.tabs button{border:0;background:none;border-radius:999px;padding:6px 18px;color:var(--muted)}
.tabs button:hover:not(:disabled){box-shadow:none;color:var(--fg)}
.tabs button[aria-selected=true]{color:#04101c;font-weight:700;background:linear-gradient(90deg,var(--a1),var(--a2))}
.stagewrap{position:relative}
.stage{position:relative;border-radius:16px;overflow-x:auto;padding:1px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 55%,var(--line)),var(--line) 35%,var(--line) 65%,color-mix(in srgb,var(--a2) 55%,var(--line)));
  box-shadow:0 0 60px -20px var(--glow)}
.stage .in{background:var(--bg2);border-radius:15px;overflow:hidden;width:max-content;min-width:100%}
canvas{display:block}
.zoom{position:absolute;right:12px;top:12px;z-index:2;display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(8px)}
.zoom button{padding:3px 11px;font-family:var(--font-mono)}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
.role{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0}
.role b{display:block;font-size:.9rem}
.role i{font-style:normal;font-family:var(--font-mono);font-size:.7rem;color:var(--a1);letter-spacing:.04em}
.role span{display:block;color:var(--muted);font-size:.8rem;line-height:1.55;margin-top:2px}
details{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:.84rem}
#json{margin-top:10px;font-family:var(--font-mono);font-size:.76rem;min-height:240px}
.doc{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 28px 24px;line-height:1.85;max-width:920px}
.doc h1{font-family:var(--font-disp);font-size:1.5rem;margin:18px 0 8px}.doc h2{font-family:var(--font-disp);font-size:1.12rem;margin:28px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}.doc h3{font-size:.98rem;margin:18px 0 6px}
.doc p{margin:8px 0}.doc ul,.doc ol{margin:8px 0;padding-left:1.4em}
.doc code{font-family:var(--font-mono);font-size:.85em;background:color-mix(in srgb,var(--bg) 70%,transparent);padding:1px 6px;border-radius:5px}
.doc pre{background:color-mix(in srgb,var(--bg) 80%,transparent);border:1px solid var(--line);border-radius:10px;padding:13px;overflow-x:auto}.doc pre code{background:none;padding:0;font-size:.8rem}
.doc .tw{overflow-x:auto}.doc table{border-collapse:collapse;font-size:.84rem;margin:10px 0}.doc th,.doc td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}.doc th{background:color-mix(in srgb,var(--a1) 8%,transparent)}
.empty{color:var(--muted);padding:30px;text-align:center}
@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto}.shell{height:auto}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  .log{max-height:220px}
  main{overflow:visible}
  html,body{height:auto}
  .tag{display:none}
}
@media (prefers-reduced-motion:reduce){.chip::before{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b1220" stroke="#22d3ee" stroke-opacity=".5"/><path d="M4 17h6l3-9 5 17 3-8h7" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>ARCHPULSE</b>
    </div>
    <span class="tag">構成が脈打つ、動くアーキテクチャ図</span>
    <span class="chip" id="llm">LLM</span>
  </header>
  <div class="app">
    <aside>
      <p class="hint">構成を日本語で書くと、役割が動きで分かる図と設計書を作ります。作ったあとは、図の下の入力欄から修正の依頼も質問もできます。</p>
      <div class="label">会話</div>
      <div class="log" id="log" aria-live="polite"></div>
    </aside>
    <main>
      <div class="titlebar"><h2 id="title"></h2><p id="subtitle"></p></div>
      <div class="tools">
        <button id="toggle" type="button">一時停止</button>
        <button id="burst" type="button">負荷を急増</button>
        <button id="speed" type="button">速度 x1</button>
        <button id="orient" type="button">縦 / 横</button>
        <button id="undo" type="button">元に戻す</button>
        <button id="redo" type="button">やり直し</button>
        <span class="spacer"></span>
        <button id="exportMd" type="button">仕様書(.md)</button>
        <button id="export" type="button">単体HTML</button>
      </div>
      <div class="tabs" role="tablist"><button role="tab" id="tab-fig" aria-selected="true" type="button">アニメ図</button><button role="tab" id="tab-doc" aria-selected="false" type="button">仕様書</button></div>
      <section id="pane-fig">
        <div class="stagewrap">
          <div class="zoom" aria-label="表示サイズ"><button id="zout" type="button" aria-label="縮小">−</button><button id="zfit" type="button">FIT</button><button id="zin" type="button" aria-label="拡大">＋</button></div>
          <div class="stage" id="stage"><div class="in"><canvas id="c" role="img" aria-label="生成された動的アーキテクチャ図"></canvas></div></div>
        </div>
        <div class="composer">
          <div class="label" id="ctitle">追加・修正の依頼はありますか？</div>
          <div class="chips" id="chips"></div>
          <textarea id="prompt" aria-label="メッセージ"></textarea>
          <div class="row"><button class="primary" id="go" type="button">送信</button><button id="newbtn" type="button">新規作成に切替</button><span class="mode" id="mode"></span><span class="hint" id="status"></span></div>
        </div>
        <div class="roles" id="roles"></div>
        <details><summary>図のJSON(直接編集して適用できます)</summary>
          <textarea id="json" spellcheck="false" aria-label="図のJSON"></textarea>
          <div class="row" style="margin-top:8px"><button id="apply" type="button">JSONを適用</button><span class="hint" id="jsonstatus"></span></div>
        </details>
      </section>
      <section id="pane-doc" hidden>
        <div class="row" style="margin-bottom:10px"><button id="gendoc" type="button">仕様書を生成/再生成</button><span class="hint" id="docstatus"></span></div>
        <article class="doc" id="doc"></article>
      </section>
    </main>
  </div>
</div>
<script src="/engine.js"></script>
<script>
// 簡易Markdown→HTML(見出し・表・リスト・コード・太字・インラインコード)。書き出しHTMLにも埋め込む。
function md(src){
  var esc=function(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
  var inl=function(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')};
  var L=String(src||'').split('\n'),o=[],i=0,list=null;
  var close=function(){if(list){o.push('</'+list+'>');list=null}};
  while(i<L.length){
    var l=L[i];
    if(/^```/.test(l)){close();var c=[];i++;while(i<L.length&&!/^```/.test(L[i])){c.push(L[i]);i++}i++;o.push('<pre><code>'+esc(c.join('\n'))+'</code></pre>');continue}
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      close();var cells=function(r){return r.trim().replace(/^\||\|$/g,'').split('|').map(function(x){return x.trim()})};
      var h=cells(l);i+=2;var rows=[];while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i])){rows.push(cells(L[i]));i++}
      o.push('<div class="tw"><table><thead><tr>'+h.map(function(x){return'<th>'+inl(x)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return'<tr>'+r.map(function(x){return'<td>'+inl(x)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>');continue}
    var m;
    if(m=l.match(/^(#{1,4})\s+(.*)/)){close();o.push('<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>');i++;continue}
    if(m=l.match(/^\s*[-*]\s+(.*)/)){if(list!=='ul'){close();o.push('<ul>');list='ul'}o.push('<li>'+inl(m[1])+'</li>');i++;continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();o.push('<ol>');list='ol'}o.push('<li>'+inl(m[1])+'</li>');i++;continue}
    close();if(l.trim())o.push('<p>'+inl(l)+'</p>');i++;
  }
  close();return o.join('\n');
}
(function(){
  var $=function(i){return document.getElementById(i)};
  var hist=[], idx=-1, eng=null, speeds=[1,2,.5], si=0, newMode=false, chat=[], docToken=0;
  var START=["Webリクエストの流れ","CI/CD","メッセージキュー"];
  var STARTP=["ユーザーのリクエストがCDN、ロードバランサー、Webサーバー2台、DBの順に流れる図。たまに5xxエラーも流れる。","開発者のgit pushからCIでのテスト、Dockerイメージ作成、レジストリ、本番へのデプロイまでの流れ。テスト失敗も流れる。","注文サービスがキューにメッセージを積み、ワーカー3台が取り出して処理し、結果をDBに保存する図。"];
  var FOLLOW=["ボトルネックはどこ？","Webサーバーを3台に増やして","このキャッシュにRedisを使う理由は？","WAFを入口に追加して"];
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  function say(t,c){var d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var orient=ls('archpulse.orient')==='h'?'h':'v';
  function cur(){return hist[idx]||null}
  function rolesHtml(s){return s.nodes.filter(function(n){return n.role}).map(function(n){return '<div class="role"><b>'+esc(n.label||n.id)+'</b>'+(n.product?'<i>'+esc(n.product)+'</i>':'')+'<span>'+esc(n.role)+'</span></div>'}).join('')}
  function persist(){ls('archflow.state3',JSON.stringify({idx:idx,hist:hist.slice(-12).map(function(h){return{spec:h.spec,doc:h.doc,req:h.req}})}))}
  function render(){
    var e=cur(); if(!e)return; var s=e.spec;
    if(eng)eng.destroy();
    $('title').textContent=s.title||'無題'; $('subtitle').textContent=s.subtitle||'';
    $('json').value=JSON.stringify(s,null,1); $('roles').innerHTML=rolesHtml(s);
    eng=ArchFlow($('c'),s,{orient:orient}); eng.autoFit($('stage'),150); eng.setSpeed(speeds[si]); $('toggle').textContent='一時停止';
    $('doc').innerHTML=e.doc?md(e.doc):'<div class="empty">仕様書はまだありません。「仕様書を生成/再生成」を押してください。</div>';
    $('undo').disabled=idx<=0; $('redo').disabled=idx>=hist.length-1;
    $('mode').textContent=newMode?'新規作成モード(次の送信でゼロから作ります)':'この図への修正依頼・質問ができます';
    $('prompt').placeholder=newMode?'例: ユーザーのリクエストがCDN、ロードバランサー、Webサーバー、DBの順に流れる図。':'例: Webサーバーを3台に増やして / ボトルネックはどこ？ / キャッシュにRedisを使う理由は？';
    $('ctitle').textContent=newMode?'どんな構成の図を作りますか？':'追加・修正の依頼はありますか？';
    $('newbtn').textContent=newMode?'図の修正に戻る':'新規作成に切替';
    persist();
  }
  function push(spec,req){hist=hist.slice(0,idx+1);hist.push({spec:spec,doc:null,req:req});idx=hist.length-1;newMode=false;render()}
  function chips(){$('chips').innerHTML='';var set=cur()&&!newMode?FOLLOW:START;set.forEach(function(t,i){var b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=function(){$('prompt').value=(cur()&&!newMode)?t:STARTP[i];$('prompt').focus()};$('chips').appendChild(b)})}

  async function genDoc(){
    var e=cur(); if(!e)return; var my=++docToken, target=e;
    $('docstatus').textContent='仕様書を生成中…(1〜2分)'; $('gendoc').disabled=true;
    try{
      var r=await fetch('/api/doc',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({spec:e.spec,request:e.req})});
      var j=await r.json(); if(!r.ok||j.error)throw new Error(j.error||'失敗');
      target.doc=j.doc; if(cur()===target)$('doc').innerHTML=md(j.doc); persist(); $('docstatus').textContent='生成しました';
    }catch(err){$('docstatus').textContent='エラー: '+(err.message||err)}
    $('gendoc').disabled=false;
  }
  async function send(){
    var p=$('prompt').value.trim(); if(!p)return;
    var e=cur(), isNew=!e||newMode;
    $('go').disabled=true; $('status').textContent='考え中…(10〜60秒)'; say(p,'u'); $('prompt').value='';
    try{
      var r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:p,current:isNew?undefined:e.spec,history:isNew?[]:chat})});
      var j=await r.json(); if(!r.ok||j.error)throw new Error(j.error||'失敗しました');
      chat.push({role:'user',text:p},{role:'assistant',text:j.reply}); say(j.reply,'a');
      if(j.spec){ push(j.spec, isNew?p:(e.req+'\n追加依頼: '+p)); chips(); genDoc(); }
    }catch(err){say(String(err.message||err),'e')}
    $('go').disabled=false; $('status').textContent='';
  }
  $('go').onclick=send;
  $('prompt').addEventListener('keydown',function(ev){if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing&&ev.keyCode!==229){ev.preventDefault();send()}});
  $('newbtn').onclick=function(){newMode=!newMode;render();chips()};
  $('undo').onclick=function(){if(idx>0){idx--;render();say('1つ前の版に戻しました。','s')}};
  $('redo').onclick=function(){if(idx<hist.length-1){idx++;render();say('やり直しました。','s')}};
  $('toggle').onclick=function(){var q=!eng.isPaused();eng.setPaused(q);$('toggle').textContent=q?'再生':'一時停止'};
  $('burst').onclick=function(){eng.burst()};
  $('speed').onclick=function(){si=(si+1)%speeds.length;eng.setSpeed(speeds[si]);$('speed').textContent='速度 x'+speeds[si]};
  $('orient').textContent=orient==='v'?'横向きにする':'縦向きにする';
  $('orient').onclick=function(){orient=orient==='v'?'h':'v';ls('archpulse.orient',orient);eng.setOrient(orient);$('orient').textContent=orient==='v'?'横向きにする':'縦向きにする'};
  $('gendoc').onclick=genDoc;
  $('zin').onclick=function(){eng.zoomBy(1.18)}; $('zout').onclick=function(){eng.zoomBy(1/1.18)}; $('zfit').onclick=function(){eng.zoomReset()};
  fetch('/api/health').then(function(r){return r.json()}).then(function(h){$('llm').textContent='LLM · '+(h.provider||'claude')+(h.model?' / '+String(h.model).replace('@cf/meta/',''):'')}).catch(function(){});
  $('apply').onclick=function(){try{var s=JSON.parse($('json').value);if(!s.nodes||!s.nodes.length)throw new Error('nodesがありません');push(s,(cur()?cur().req:'')+'\n(JSON直接編集)');$('jsonstatus').textContent='適用しました'}catch(err){$('jsonstatus').textContent='エラー: '+err.message}};
  function tab(n){var f=n==='fig';if(f&&eng)setTimeout(function(){eng.refit()},30);$('pane-fig').hidden=!f;$('pane-doc').hidden=f;$('tab-fig').setAttribute('aria-selected',f);$('tab-doc').setAttribute('aria-selected',!f)}
  $('tab-fig').onclick=function(){tab('fig')}; $('tab-doc').onclick=function(){tab('doc')};

  function dl(name,mime,data){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;a.click()}
  function fname(s){return (s.title||'archflow').replace(/[^\w\u3040-\u30ff\u4e00-\u9fff-]+/g,'_')}
  $('exportMd').onclick=function(){var e=cur();if(!e)return;if(!e.doc){$('docstatus').textContent='先に仕様書を生成してください';tab('doc');return}dl(fname(e.spec)+'_設計書.md','text/markdown',e.doc)};
  $('export').onclick=async function(){
    var e=cur(); if(!e)return; var spec=e.spec;
    var src=await (await fetch('/engine.js')).text();
    var css=getComputedStyle(document.documentElement), keys=['--bg','--panel','--fg','--muted','--line','--k8s','--info','--loki','--warn','--err','--purple'];
    var style=':root{'+keys.map(function(k){return k+':'+css.getPropertyValue(k).trim()}).join(';')+'}'
     +'body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font-family:"Noto Sans JP",system-ui,sans-serif}h1{font-size:1.4rem;margin:0}p.s{color:var(--muted);margin:4px 0 16px}'
     +'.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto}canvas{display:block;width:100%}'
     +'.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:12px 0}.role{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.role b{display:block;font-size:.88rem}.role i{font-style:normal;font-family:monospace;font-size:.72rem;color:var(--k8s)}.role span{display:block;color:var(--muted);font-size:.8rem}'
     +'.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 26px 22px;line-height:1.8;max-width:900px}.doc h2{border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:26px}.doc code{font-family:monospace;background:var(--bg);padding:1px 5px;border-radius:4px}.doc pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}.doc pre code{padding:0}.doc .tw{overflow-x:auto}.doc table{border-collapse:collapse;font-size:.84rem}.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}.doc th{background:var(--bg)}';
    var html='<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(spec.title||'ArchFlow')+'</title>'
     +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap"><style>'+style+'</style></head><body>'
     +'<h1>'+esc(spec.title||'')+'</h1><p class="s">'+esc(spec.subtitle||'')+'</p><div class="st"><canvas id="c"></canvas></div><div class="roles">'+rolesHtml(spec)+'</div>'
     +(e.doc?'<article class="doc" id="d"></article>':'')
     +'<script>'+src.replace(/<\//g,'<\\/')+'<\/script><script>'+md.toString()+';ArchFlow(document.getElementById("c"),'+JSON.stringify(spec).replace(/</g,'\\u003c')+',{orient:"'+orient+'"}).autoFit(document.querySelector(".st"));'
     +(e.doc?'document.getElementById("d").innerHTML=md('+JSON.stringify(e.doc).replace(/</g,'\\u003c')+');':'')+'<\/script></body></html>';
    dl(fname(spec)+'.html','text/html',html);
  };

  (async function(){
    var saved=null; try{saved=JSON.parse(ls('archflow.state3')||'null')}catch(e){}
    if(saved&&saved.hist&&saved.hist.length){hist=saved.hist;idx=Math.min(saved.idx,hist.length-1)}
    else{
      var s=await (await fetch('/sample.json')).json(), doc=null;
      try{var r=await fetch('/sample.md');if(r.ok)doc=await r.text()}catch(e){}
      hist=[{spec:s,doc:doc,req:'Kubernetes の Pod のログが Loki に届くまでの流れ(サンプル)'}];idx=0;
    }
    render(); chips();
  })();
})();
</script>
</body>
</html>
